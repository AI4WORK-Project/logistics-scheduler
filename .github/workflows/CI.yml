name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install package and dependencies
        run: |
          python3 -m pip install .[test]
      - name: Run all tests
        run: |
          python -m pytest ./tests/*.py
      - name: Client example test
        run: |
          python server.py &
          SERVER_PID=$!
          timeout 60 bash -c 'until curl -sf http://localhost:5000/health; do sleep 1; done'
          python examples/client_example.py
          kill $SERVER_PID
      - name: Log in to registry
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
      - name: Build and push the container image
        if: github.event_name == 'push'
        run: |
          [[ "${{ github.ref }}" == "refs/tags/"* ]] && IMAGE_VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,' | sed -e 's/^v//') || IMAGE_VERSION="latest"
          # the image is also published as logistics-scheduler-kafka, the name used by Pilot-Logistics
          docker buildx build . --push --file ./Dockerfile \
            --tag ${{ env.REGISTRY }}/ai4work-project/logistics-scheduler:$IMAGE_VERSION \
            --tag ${{ env.REGISTRY }}/ai4work-project/logistics-scheduler-kafka:$IMAGE_VERSION
